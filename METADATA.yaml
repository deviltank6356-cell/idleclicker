AutoName: idle coin clicker
Summary: A fun incremental clicker game
Description: |-
    A simple and addictive clicker game where you can:
    
    * Click to earn money
    * Upgrade your clicking power
    * Buy auto-clickers for passive income
    * Watch your earnings grow exponentially
    
    Features:
    * Clean and modern interface
    * Upgrades that scale in cost
    * Auto-clickers for passive income generation
    * Real-time money counter with number formatting

    NOTE: GAME WILL BE UPDATED WEEKLY IF I HAVE THE TIME AND THIS GAME IS IN EARLY STAGES OF DEVELOPMENT SO EXPECT BUGS
    
    Perfect for casual gaming sessions!

